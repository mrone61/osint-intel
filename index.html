<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT INTEL SEARCH</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen p-4">
<div class="max-w-3xl mx-auto text-center">
  <h1 class="text-3xl font-black mt-8">OSINT INTEL</h1>
  <p class="text-zinc-500 text-xs tracking-[0.3em] mt-1">OPEN SOURCE INTELLINGECE</p>
  <p class="text-zinc-600 text-[10px] mt-2">Author by Mr.One</p>
  
  <div class="flex gap-2 mt-8 text-left">
    <input id="q" value="Prabowo Subianto" type="text" class="flex-1 bg-zinc-900 border border-zinc-700 rounded-lg px-4 py-3 outline-none">
    <button onclick="search()" class="bg-white text-black font-bold px-6 rounded-lg">CARI</button>
  </div>
  <div id="status" class="text-zinc-500 text-sm mt-4"></div>
  <div id="results" class="grid gap-3 mt-4 text-left"></div>
</div>
<script>
async function search(){
  const query = document.getElementById('q').value.trim();
  if(!query) return;
  document.getElementById('status').textContent = 'Mencari '+query+'...';
  document.getElementById('results').innerHTML = '';
  try{
    // PAKAI /api/index BIAR PASTI KENA PYTHON
    const res = await fetch(`/api/index?q=${encodeURIComponent(query)}`);
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch(e){ throw new Error('API masih return HTML, cek vercel.json & api/index.py sudah ke-deploy belum. Response: '+text.slice(0,100)); }
    
    document.getElementById('status').textContent = `Ditemukan ${data.total} sumber untuk "${data.query}"`;
    data.results.forEach(r => {
      document.getElementById('results').innerHTML += `
        <a href="${r.url}" target="_blank" class="block bg-zinc-900 border border-zinc-800 hover:border-white rounded-lg p-4">
          <div class="flex justify-between"><span class="font-bold text-sm">${r.title}</span><span class="text-[10px] bg-zinc-800 px-2 py-1 rounded">${r.source}</span></div>
          <div class="text-xs text-zinc-500 break-all mt-1">${r.url}</div>
        </a>`;
    });
  }catch(e){ document.getElementById('status').textContent = 'Error: '+e.message; }
}
window.onload = search;
</script>
</body>
</html>
