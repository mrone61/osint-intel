<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT INTEL - Open Source Search</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen p-4">
<div class="max-w-3xl mx-auto">
  <h1 class="text-2xl font-bold text-center mt-6 mb-2">OSINT INTEL</h1>
  <p class="text-center text-zinc-400 text-sm mb-6">Papua Threat Intelligence</p>
    <p class="text-center text-zinc-400 text-sm mb-6">Author by Mr.One </p>
  
  <div class="flex gap-2 mb-8">
    <input id="q" type="text" placeholder="Ketik nama lengkap, mis: Jaden Smith" 
      class="flex-1 bg-zinc-900 border border-zinc-700 rounded-lg px-4 py-3 outline-none focus:border-white">
    <button onclick="search()" class="bg-white text-black font-bold px-6 rounded-lg">CARI</button>
  </div>

  <div id="status" class="text-center text-zinc-500 text-sm mb-4"></div>
  <div id="results" class="grid gap-3"></div>
</div>

<script>
async function search(){
  const query = document.getElementById('q').value.trim();
  if(!query){ alert('Isi nama dulu bro'); return; }
  const status = document.getElementById('status');
  const results = document.getElementById('results');
  status.textContent = `Mencari jejak publik untuk "${query}"...`;
  results.innerHTML = '';

  try{
    const res = await fetch(`/api?q=${encodeURIComponent(query)}`);
    const data = await res.json();
    
    if(data.error){
      status.textContent = data.error;
      return;
    }
    
    status.textContent = `Ditemukan ${data.total} sumber terbuka untuk "${data.query}"`;
    
    data.results.forEach(r => {
      const card = document.createElement('a');
      card.href = r.url;
      card.target = '_blank';
      card.className = 'block bg-zinc-900 border border-zinc-800 hover:border-zinc-600 rounded-lg p-4 transition';
      card.innerHTML = `
        <div class="flex justify-between items-start gap-2">
          <div>
            <div class="font-semibold text-sm mb-1">${r.title}</div>
            <div class="text-xs text-zinc-500 break-all">${r.url}</div>
          </div>
          <span class="text-[10px] bg-zinc-800 px-2 py-1 rounded uppercase">${r.source}</span>
        </div>
      `;
      results.appendChild(card);
    });

  }catch(e){
    status.textContent = 'Gagal fetch API: ' + e.message;
  }
}

document.getElementById('q').addEventListener('keydown', e => { if(e.key==='Enter') search(); });
</script>
</body>
</html>
