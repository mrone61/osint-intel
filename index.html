<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT INTEL SEARCH</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'], mono: ['JetBrains Mono','monospace'] } } } }
</script>
<style>
body{font-family:'JetBrains Mono',monospace}
h1,h2{font-family:'Inter',sans-serif}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#27272a;border-radius:10px}
</style>
</head>
<body class="bg-[#050507] text-zinc-100 min-h-screen antialiased selection:bg-green-500/30">

<div class="max-w-6xl mx-auto px-4 md:px-6 py-4 md:py-8">

  <!-- HEADER CENTERED PRO -->
  <div class="relative overflow-hidden border border-zinc-800 rounded-[24px] bg-gradient-to-b from-zinc-900/80 to-zinc-900/20 p-6 md:p-12 flex flex-col items-center justify-center text-center min-h-[52vh]">
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-green-500/10 blur-[120px] pointer-events-none"></div>
    
    <div class="relative w-full flex flex-col items-center">
      <div class="inline-flex items-center gap-2 border border-zinc-800 bg-black rounded-full px-4 py-1.5 text-[9px] tracking-[0.2em] text-zinc-400">
        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> LIVE VALIDATION ENGINE
      </div>
      <h1 class="text-4xl md:text-6xl font-black tracking-tighter mt-6">OSINT INTEL</h1>
      <p class="text-[11px] tracking-[0.4em] text-zinc-500 mt-2">OPEN SOURCE INTELLIGENCE</p>
      <!-- SEARCH BOX CENTERED -->
      <div class="flex flex-col md:flex-row gap-3 mt-10 w-full max-w-3xl mx-auto justify-center">
        <div class="flex-1 relative">
          <input id="q" value="" 
            class="w-full bg-black border border-zinc-700 rounded-2xl px-6 py-4 text-[14px] text-center md:text-left outline-none focus:border-green-500 focus:ring-2 focus:ring-green-500/20 transition placeholder:text-zinc-600" 
            placeholder="Ketik apapun... Nama, Peristiwa, Lokasi...">
        </div>
        <button onclick="doSearch()" id="btn" 
          class="bg-white text-black font-black px-10 py-4 rounded-2xl text-sm tracking-wide hover:bg-zinc-200 active:scale-[0.98] transition flex items-center justify-center gap-2 shrink-0 mx-auto md:mx-0 w-full md:w-auto">
          <span id="btnText">CARI</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </div>
      <p class="text-[10px] text-zinc-600 mt-4">Tekan Enter untuk scan</p>
    </div>
  </div>

  <!-- FILTER BAR CENTERED -->
  <div class="flex flex-col md:flex-row gap-3 md:items-center justify-center mt-8 py-3 border-y border-zinc-900/50">
    <div id="status" class="text-[11px] md:text-[12px] text-zinc-400 font-mono text-center"></div>
  </div>

  <!-- PROGRESS BAR TAMBAHAN - TIDAK UBAH TAMPILAN LAIN -->
  <div id="progressWrap" class="hidden mt-6 max-w-3xl mx-auto">
    <div class="flex justify-between text-[10px] font-mono text-zinc-500 mb-2">
      <span id="progressText">0/120</span>
      <span id="progressPercent">0%</span>
    </div>
    <div class="w-full bg-zinc-900 border border-zinc-800 rounded-full h-2 overflow-hidden">
      <div id="progressBar" class="h-full bg-white transition-all duration-300" style="width:0%"></div>
    </div>
    <div id="progressDomain" class="text-[10px] text-zinc-600 font-mono mt-2 text-center truncate">-</div>
  </div>

  <div class="flex gap-2 overflow-x-auto scrollbar-none justify-center mt-4 pb-2">
    <button onclick="filterCat('all')" id="f-all" class="filter-btn whitespace-nowrap bg-white text-black px-5 py-2.5 rounded-full text-[11px] font-bold transition">ALL</button>
    <button onclick="filterCat('news')" id="f-news" class="filter-btn whitespace-nowrap bg-zinc-900 border border-zinc-800 hover:border-zinc-700 px-5 py-2.5 rounded-full text-[11px] transition">NEWS</button>
    <button onclick="filterCat('gov')" id="f-gov" class="filter-btn whitespace-nowrap bg-zinc-900 border border-zinc-800 hover:border-zinc-700 px-5 py-2.5 rounded-full text-[11px] transition">GOV / EDU</button>
    <button onclick="filterCat('pdf')" id="f-pdf" class="filter-btn whitespace-nowrap bg-zinc-900 border border-zinc-800 hover:border-zinc-700 px-5 py-2.5 rounded-full text-[11px] transition">DOCS</button>
  </div>

  <!-- RESULTS GRID -->
  <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 mt-8"></div>
  
  <div id="loadMoreWrap" class="text-center mt-10 hidden">
    <button onclick="loadMore()" class="border border-zinc-700 hover:border-zinc-500 hover:bg-zinc-900 px-8 py-3 rounded-full text-xs font-mono transition">LOAD 50 LAGI ↓</button>
  </div>
  
  
  <div class="text-center mt-16 border-t border-zinc-900 pt-8">
    <div class="text-[10px] text-zinc-700 font-mono">© Powered By. MR ONE</div>
    <a href="https://github.com/mrone61" target="_blank" rel="noopener" class="inline-flex items-center gap-2 mt-3 border border-zinc-800 hover:border-white bg-zinc-900/50 hover:bg-white text-zinc-400 hover:text-black px-5 py-2 rounded-full text-[10px] font-bold transition">
      Follow: github.com/mrone61
    </a>
  </div>

</div>

<script>
let allData = [];
let shown = 0;
let currentCat = 'all';
const NEWS_DOMAINS = ['detik','kompas','cnn','liputan6','tribun','antaranews','tempo','kumparan'];
const GOV_DOMAINS = ['go.id','ac.id','pddikti','kemdikbud','kemdiktisaintek','sinta','garuda','gov','edu'];

function getCat(source){
  const s = source.toLowerCase();
  if(s.includes('.pdf')) return 'pdf';
  if(NEWS_DOMAINS.some(d=>s.includes(d))) return 'news';
  if(GOV_DOMAINS.some(d=>s.includes(d))) return 'gov';
  return 'all';
}

function filterCat(cat){
  currentCat = cat;
  document.querySelectorAll('.filter-btn').forEach(b=>{
    b.className='filter-btn whitespace-nowrap bg-zinc-900 border border-zinc-800 hover:border-zinc-700 px-5 py-2.5 rounded-full text-[11px] transition';
  });
  document.getElementById('f-'+cat).className='filter-btn whitespace-nowrap bg-white text-black px-5 py-2.5 rounded-full text-[11px] font-bold transition';
  shown = 0;
  document.getElementById('results').innerHTML = '';
  render();
}

function render(){
  let filtered = currentCat==='all' ? allData : allData.filter(r=> getCat(r.source+' '+r.url)===currentCat);
  const slice = filtered.slice(shown, shown+50);
  slice.forEach(r=>{
    document.getElementById('results').innerHTML += `
      <a href="${r.url}" target="_blank" rel="noopener" class="group relative block bg-zinc-900/40 border border-zinc-800 hover:border-green-500/50 rounded-2xl p-4 transition-all hover:bg-zinc-900/80 hover:-translate-y-[1px] text-left">
        <div class="flex justify-between items-start gap-3">
          <h3 class="font-bold text-[13px] leading-snug group-hover:text-white line-clamp-2">${r.title || r.source}</h3>
          <span class="text-[9px] px-2.5 py-1 rounded-full uppercase shrink-0 bg-green-950/60 text-green-300 border border-green-800/50 font-bold tracking-wide">${r.source.slice(0,18)}</span>
        </div>
        <div class="text-[11px] text-zinc-500 break-all mt-3 line-clamp-2 font-mono bg-black/50 rounded-lg p-2 border border-zinc-900">${r.url}</div>
        <div class="flex items-center justify-center md:justify-start gap-2 mt-3">
          <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
          <span class="text-[10px] text-green-400 font-bold tracking-wide">DITEMUKAN • VALID</span>
        </div>
      </a>
    `;
  });
  shown += slice.length;
  document.getElementById('loadMoreWrap').style.display = shown < filtered.length ? 'block' : 'none';
  document.getElementById('status').innerHTML = `Menampilkan <b class="text-green-400">${shown}</b> dari <b class="text-white">${filtered.length}</b> yang VALID`;
}

function loadMore(){ render(); }

async function doSearch(){
  const q = document.getElementById('q').value.trim();
  if(!q) return;
  const btn = document.getElementById('btn');
  const btnText = document.getElementById('btnText');
  btn.disabled = true;
  btnText.textContent = 'SCANNING...';
  document.getElementById('status').textContent = `Mengecek langsung ke server masing-masing untuk "${q}"...`;
  document.getElementById('results').innerHTML = '';
  document.getElementById('progressWrap').classList.remove('hidden');
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('progressText').textContent = '0/120';
  document.getElementById('progressPercent').textContent = '0%';
  allData = [];
  shown = 0;
  
  try{
    // STEP 1: CEK PDDIKTI + DAPAT LIST 120 DOMAIN (cepat 2 detik)
    const res = await fetch(`/api?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    
    if(data.pddikti_status === 'NOT_FOUND' || !data.domains || data.domains.length===0){
      document.getElementById('status').textContent = `Tidak ada server yang menyebut "${q}"`;
      document.getElementById('progressWrap').classList.add('hidden');
      document.getElementById('results').innerHTML = `
        <div class="col-span-full text-center py-16 border border-dashed border-zinc-800 rounded-2xl">
          <div class="text-zinc-500 text-sm">Tidak ada yang valid</div>
          <div class="text-zinc-600 text-xs mt-1 font-mono">Nama tidak ditemukan di server manapun dengan validasi ketat</div>
        </div>`;
      return;
    }

    const domains = data.domains;
    const total = domains.length;
    document.getElementById('status').textContent = `PDDIKTI OK • Scan ${total} situs Sabang-Merauke...`;

    // STEP 2: LOOP SATU-SATU BIAR ADA PROGRESS 1-2 DETIK (AMAN VERCEL 10 DETIK)
    for(let i=0;i<domains.length;i++){
      const d = domains[i];
      const pct = Math.round(((i+1)/total)*100);
      document.getElementById('progressText').textContent = `${i+1}/${total}`;
      document.getElementById('progressPercent').textContent = `${pct}%`;
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('progressDomain').textContent = `Cek ${d}...`;

      try{
        const cek = await fetch(`/api?q=${encodeURIComponent(q)}&domain=${encodeURIComponent(d)}`).then(r=>r.json());
        if(cek.valid){
          allData.push({title: cek.title, url: cek.url, source: cek.domain});
          // render langsung biar user lihat hasil sambil jalan
          filterCat(currentCat);
        }
      }catch(e){}
    }

    document.getElementById('progressDomain').textContent = `Selesai ${total} situs`;
    document.getElementById('status').innerHTML = `Scan selesai • Menampilkan <b class="text-green-400">${allData.length}</b> dari <b class="text-white">${total}</b> yang VALID`;

    if(allData.length===0){
      document.getElementById('results').innerHTML = `
        <div class="col-span-full text-center py-16 border border-dashed border-zinc-800 rounded-2xl">
          <div class="text-zinc-500 text-sm">Tidak ada yang valid</div>
          <div class="text-zinc-600 text-xs mt-1 font-mono">Nama tidak ditemukan di server manapun dengan validasi ketat</div>
        </div>`;
    }

  }catch(e){
    document.getElementById('status').textContent = 'Error API: '+e.message;
  } finally {
    btn.disabled = false;
    btnText.textContent = 'CARI';
  }
}
document.getElementById('q').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
</script>
</body>
</html>
