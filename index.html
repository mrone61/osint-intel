    <button onclick="filterCat('bencana')" id="f-bencana" class="filter-btn whitespace-nowrap bg-zinc-900 border border-zinc-800 hover:border-zinc-700 px-5 py-2.5 rounded-full text-[11px] transition">BMKG / BNPB</button>
    <button onclick="filterCat('gov')" id="f-gov" class="filter-btn whitespace-nowrap bg-zinc-900 border border-zinc-800 hover:border-zinc-700 px-5 py-2.5 rounded-full text-[11px] transition">GOV / BPS / EDU</button>
    <button onclick="filterCat('tni')" id="f-tni" class="filter-btn whitespace-nowrap bg-zinc-900 border border-zinc-800 hover:border-zinc-700 px-5 py-2.5 rounded-full text-[11px] transition">TNI / POLRI</button>
    <button onclick="filterCat('pdf')" id="f-pdf" class="filter-btn whitespace-nowrap bg-zinc-900 border border-zinc-800 hover:border-zinc-700 px-5 py-2.5 rounded-full text-[11px] transition">DOCS</button>

  <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 mt-8"></div>

  <div class="text-center mt-16 border-t border-zinc-900 pt-8">
    <div class="text-[10px] text-zinc-700 font-mono">© Powered By. MR ONE</div>
    <div class="flex flex-col md:flex-row items-center justify-center gap-3 mt-5">
      
      <!-- GITHUB LOGO -->

        github.com/mrone61

      <!-- WHATSAPP LOGO -->
      <a href="https://wa.me/628133244757" target="_blank" rel="noopener" class="group inline-flex items-center gap-2.5 border border-green-900 hover:border-[#25D366] bg-[#0f1a12] hover:bg-[#25D366] text-[#25D366] hover:text-black px-6 py-3 rounded-full text-[11px] font-bold transition-all">

</div>

<script>
let allData = [];
let shown = 0;
let currentCat = 'all';
const NEWS_DOMAINS = ['detik','kompas','cnn','liputan6','tribun','antaranews','tempo','kumparan','jpnn','jawapos','idntimes','suara','grid','bisnis','kontan','idxchannel','katadata','tirto','voi','akurat','mongabay','narasi','pikiran-rakyat','rmol','inilah','wartaekonomi','era','bloomberg','disway','manadopost','bmanado','detiksulut','herald','fajar','lintas-sulut'];
const BENCANA_DOMAINS = ['bmkg','bnpb','basarnas'];
const TNI_DOMAINS = ['polri','tni.mil','kemhan','kejaksaan','mahkamahagung','mkri'];
const GOV_DOMAINS = ['go.id','ac.id','pddikti','kemdikbud','kemdiktisaintek','sinta','garuda','gov','edu','bps','bi.go.id','ojk','kemenkeu','kemendagri','kemensos','kemlu','kpu','dpr','indonesia.go.id'];

function getCat(source){
  const s = source.toLowerCase();
  if(s.includes('.pdf')) return 'pdf';
  if(BENCANA_DOMAINS.some(d=>s.includes(d))) return 'bencana';
  if(TNI_DOMAINS.some(d=>s.includes(d))) return 'tni';
  if(NEWS_DOMAINS.some(d=>s.includes(d))) return 'news';
  if(GOV_DOMAINS.some(d=>s.includes(d))) return 'gov';
  return 'all';
}

function filterCat(cat){
  currentCat = cat;
  document.querySelectorAll('.filter-btn').forEach(b=>{
    b.className='filter-btn whitespace-nowrap bg-zinc-900 border border-zinc-800 hover:border-zinc-700 px-5 py-2.5 rounded-full text-[11px] transition';
  });
  const btn = document.getElementById('f-'+cat);
  if(btn) btn.className='filter-btn whitespace-nowrap bg-white text-black px-5 py-2.5 rounded-full text-[11px] font-bold transition';
  shown = 0;
  document.getElementById('results').innerHTML = '';
  render();
}

function render(){
  let filtered = currentCat==='all' ? allData : allData.filter(r=> getCat(r.source+' '+r.url)===currentCat);
  const slice = filtered.slice(shown, shown+50);
  slice.forEach(r=>{
    document.getElementById('results').innerHTML += `
      <a href="${r.url}" target="_blank" rel="noopener" class="group relative block bg-zinc-900/40 border border-zinc-800 hover:border-green-500/50 rounded-2xl p-4 transition-all hover:bg-zinc-900/80 hover:-translate-y-[1px] text-left">
        <div class="flex justify-between items-start gap-3">
          <h3 class="font-bold text-[13px] leading-snug group-hover:text-white line-clamp-2">${r.title || r.source}</h3>
          <span class="text-[9px] px-2.5 py-1 rounded-full uppercase shrink-0 bg-green-950/60 text-green-300 border border-green-800/50 font-bold tracking-wide">${r.source.slice(0,18)}</span>
        </div>
        <div class="text-[11px] text-zinc-500 break-all mt-3 line-clamp-2 font-mono bg-black/50 rounded-lg p-2 border border-zinc-900">${r.url}</div>
        <div class="flex items-center justify-center md:justify-start gap-2 mt-3">
          <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
          <span class="text-[10px] text-green-400 font-bold tracking-wide">DITEMUKAN • VALID</span>
        </div>
      </a>
    `;
  });
  shown += slice.length;
  document.getElementById('loadMoreWrap').style.display = shown < filtered.length ? 'block' : 'none';
  document.getElementById('status').innerHTML = `Menampilkan <b class="text-green-400">${shown}</b> dari <b class="text-white">${filtered.length}</b> yang VALID • Filter: ${currentCat.toUpperCase()}`;
}

function loadMore(){ render(); }

async function doSearch(){
  const q = document.getElementById('q').value.trim();
  if(!q) return;
  const btn = document.getElementById('btn');
  const btnText = document.getElementById('btnText');
  btn.disabled = true;
  btnText.textContent = 'SCANNING...';
  document.getElementById('status').textContent = `Mengecek langsung ke server masing-masing untuk "${q}"...`;
  document.getElementById('results').innerHTML = '';
  document.getElementById('progressWrap').classList.remove('hidden');
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('progressText').textContent = '0/0';
  document.getElementById('progressPercent').textContent = '0%';
  allData = [];
  shown = 0;
  
  try{
    const res = await fetch(`/api?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    
    if(data.pddikti_status === 'NOT_FOUND' || !data.domains || data.domains.length===0){
      document.getElementById('status').textContent = `Tidak ada server yang menyebut "${q}"`;
      document.getElementById('progressWrap').classList.add('hidden');
      document.getElementById('results').innerHTML = `<div class="col-span-full text-center py-16 border border-dashed border-zinc-800 rounded-2xl"><div class="text-zinc-500 text-sm">Tidak ada yang valid</div><div class="text-zinc-600 text-xs mt-1 font-mono">Nama tidak ditemukan di server manapun dengan validasi ketat</div></div>`;
      return;
    }

    const domains = data.domains;
    const total = domains.length;
    document.getElementById('progressText').textContent = `0/${total}`;
    document.getElementById('status').textContent = `PDDIKTI OK • Scan ${total} situs Sabang-Merauke (BMKG/BPS/TNI/Polri)...`;

    for(let i=0;i<domains.length;i++){
      const d = domains[i];
      const pct = Math.round(((i+1)/total)*100);
      document.getElementById('progressText').textContent = `${i+1}/${total}`;
      document.getElementById('progressPercent').textContent = `${pct}%`;
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('progressDomain').textContent = `Cek ${d}... (jeda 3.5s legal)`;
      try{
        const cek = await fetch(`/api?q=${encodeURIComponent(q)}&domain=${encodeURIComponent(d)}`).then(r=>r.json());
        if(cek.valid){
          allData.push({title: cek.title, url: cek.url, source: cek.domain});
          filterCat(currentCat);
        }
      }catch(e){}
    }

    document.getElementById('progressDomain').textContent = `Selesai ${total} situs • ${allData.length} VALID`;
    document.getElementById('status').innerHTML = `Scan selesai • Menampilkan <b class="text-green-400">${allData.length}</b> dari <b class="text-white">${total}</b> yang VALID`;
    if(allData.length===0){
      document.getElementById('results').innerHTML = `<div class="col-span-full text-center py-16 border border-dashed border-zinc-800 rounded-2xl"><div class="text-zinc-500 text-sm">Tidak ada yang valid</div><div class="text-zinc-600 text-xs mt-1 font-mono">Nama tidak ditemukan di server manapun dengan validasi ketat</div></div>`;
    }
  }catch(e){
    document.getElementById('status').textContent = 'Error API: '+e.message;
  } finally {
    btn.disabled = false;
    btnText.textContent = 'CARI';
  }
}
document.getElementById('q').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
</script>
